# ==============================================================================
# DevPilot SRE Platform - GitLab CI/CD Pipeline
# Cumplimiento de la Etapa 5: Lanzamiento - Diapositiva 11 (GitLab CI/CD)
# ==============================================================================

stages:
  - build
  - test
  - quality-gate
  - release

variables:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

compile-ast:
  stage: build
  image: python:3.11-slim
  script:
    - python -m py_compile devpilot_core/*.py microservices/*/*.py
    - echo "Compilación AST de Python completada con éxito."

unit-tests-junit:
  stage: test
  image: maven:3.9-eclipse-temurin-11
  script:
    - mvn test -B
    - echo "Pruebas JUnit 5 superadas con 0 fallos."

unit-tests-pytest:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - pytest tests/ -v
    - echo "Pruebas Pytest superadas con 0 fallos."

quality-gate-evaluation:
  stage: quality-gate
  script:
    - ./verify-build.sh
    - echo "Quality Gate superado: 37/37 verificaciones nominales."

docker-release-package:
  stage: release
  image: docker:24-cli
  services:
    - docker:24-dind
  script:
    - docker compose build
    - echo "Artefactos empaquetados e inmutables listos para distribución."
