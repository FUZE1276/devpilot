# ==============================================================================
# DevPilot SRE Platform - Prometheus Telemetry & Scraping Configuration
# Cumplimiento de la Etapa 8: Monitor - Diapositiva 17 (Prometheus)
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Monitoreo del Motor Central DevPilot
  - job_name: "devpilot-core"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["devpilot_core:8000", "127.0.0.1:8000"]
        labels:
          tier: "control-plane"
          environment: "production"

  # 2. Monitoreo de Microservicio de Ordenes (FastAPI / Prometheus format)
  - job_name: "orders-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["orders_service:3003", "127.0.0.1:3003"]
        labels:
          service: "orders"
          framework: "fastapi"

  # 3. Monitoreo de Microservicio de Usuarios (Express / Node.js)
  - job_name: "users-service"
    metrics_path: "/health"
    static_configs:
      - targets: ["users_service:3001", "127.0.0.1:3001"]
        labels:
          service: "users"
          framework: "express"

  # 4. Monitoreo de Proxy Operacional Nginx
  - job_name: "nginx-proxy"
    metrics_path: "/nginx-health"
    static_configs:
      - targets: ["nginx:80", "127.0.0.1:80"]
        labels:
          role: "reverse-proxy"
