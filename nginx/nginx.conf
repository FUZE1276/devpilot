# ==============================================================================
# DevPilot SRE Platform - Nginx Reverse Proxy & Load Balancer Configuration
# Cumplimiento de la Etapa 7: Operar - Diapositiva 14 (Nginx)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstreams hacia los microservicios de DevPilot
    upstream core_cluster {
        server devpilot_core:8000;
    }

    upstream users_cluster {
        server users_service:3001;
    }

    upstream orders_cluster {
        server orders_service:3003;
    }

    server {
        listen 80;
        server_name localhost devpilot.local;

        # 1. Reverse Proxy hacia el Dashboard SRE y Core de DevPilot
        location / {
            proxy_pass http://core_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 2. Reverse Proxy hacia API Gateway de Usuarios
        location /gateway/users/ {
            proxy_pass http://users_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Reverse Proxy hacia API Gateway de Ordenes
        location /gateway/orders/ {
            proxy_pass http://orders_cluster/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Endpoint de Salud Operacional de Nginx
        location /nginx-health {
            access_log off;
            return 200 '{"status":"UP","proxy":"nginx","message":"Operacion nominal activa"}';
            add_header Content-Type application/json;
        }
    }
}
