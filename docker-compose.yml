# DevPilot SRE Platform - Docker Compose Specification (Compose Specification Standard)
services:
  # DevPilot Core: Observabilidad, Monitoreo, Inyección de Caos y Agente Claude con Tool Use
  devpilot_core:
    build:
      context: ./devpilot_core
      dockerfile: Dockerfile
    container_name: devpilot_core
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./devpilot_core:/app
      - devpilot_data:/app/data
    environment:
      - DB_PATH=/app/data/devpilot.db
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-devpilot-sre-super-secret-crypto-key-2026-auth-token}
      - JWT_EXPIRATION_SECONDS=${JWT_EXPIRATION_SECONDS:-1800}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-DevPilot SRE <noreply@devpilot.io>}
      - SMTP_TLS=${SMTP_TLS:-true}
      - SMTP_OVERRIDE_RECIPIENT=${SMTP_OVERRIDE_RECIPIENT:-fuze1276@gmail.com}
      - EMAIL_OTP_EXPIRE_MINUTES=${EMAIL_OTP_EXPIRE_MINUTES:-5}
      - EMAIL_OTP_DEV_MODE=${EMAIL_OTP_DEV_MODE:-false}
    networks:
      - devpilot_net
    depends_on:
      - users_service
      - products_service
      - orders_service
      - payments_service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Microservicio de Usuarios (Node.js/Express)
  users_service:
    build:
      context: ./microservices/users
      dockerfile: Dockerfile
    container_name: devpilot_users
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./microservices/users:/app
      - /app/node_modules
    environment:
      - PORT=3001
      - NODE_ENV=production
    networks:
      - devpilot_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 8s

  # Microservicio de Productos (Python/FastAPI)
  products_service:
    build:
      context: ./microservices/products
      dockerfile: Dockerfile
    container_name: devpilot_products
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./microservices/products:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - devpilot_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 8s

  # Microservicio de Órdenes (Python/FastAPI)
  orders_service:
    build:
      context: ./microservices/orders
      dockerfile: Dockerfile
    container_name: devpilot_orders
    restart: unless-stopped
    ports:
      - "3003:3003"
    volumes:
      - ./microservices/orders:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - devpilot_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3003/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 8s

  # Microservicio de Pagos (Python/FastAPI :3004)
  payments_service:
    build:
      context: ./microservices/payments
      dockerfile: Dockerfile
    container_name: devpilot_payments
    restart: unless-stopped
    ports:
      - "3004:3004"
    volumes:
      - ./microservices/payments:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - devpilot_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3004/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 8s

networks:
  devpilot_net:
    driver: bridge
    name: devpilot_net

volumes:
  devpilot_data:
    driver: local
